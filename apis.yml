name: Screenpipe
description: >-
  Screenpipe is a local-first, source-available desktop application (by Mediar
  AI, Y Combinator S26) that continuously captures everything you see, say, and
  hear on your computer, reads on-screen text through OS accessibility APIs with
  an OCR fallback, transcribes system and microphone audio locally with Whisper,
  and stores it all in a local SQLite database as a private, searchable memory.
  It exposes a full local REST API at http://localhost:3030 (71 operations
  across search, frames, audio, meetings, memories, speakers, tags, vault,
  cloud sync, cloud archive, and data retention) and ships as an MCP server so
  agents like Claude, Cursor, Codex, and Cline can query screen history and
  meeting transcripts. Automations are built as "pipes" — scheduled AI agents
  written in plain markdown. It is positioned as an open, local-first
  alternative to Rewind.ai, Microsoft Recall, and cloud meeting bots.
