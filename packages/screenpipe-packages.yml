generated: '2026-07-21'
method: searched
source: https://www.npmjs.com/org/screenpipe
notes: >-
  First-party client libraries are published under the @screenpipe npm scope.
  The desktop app / recorder itself is distributed via `npx screenpipe` and the
  downloadable desktop build (screenpi.pe/onboarding); the MCP server ships as
  the screenpipe-mcp npm package. The Rust core lives in the monorepo /crates
  directory but is not published to crates.io as a public client SDK.
packages:
