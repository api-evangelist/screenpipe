  registry: npm
  name: "@screenpipe/js"
  url: https://www.npmjs.com/package/@screenpipe/js
  install: npm install @screenpipe/js
  version: 1.0.21
  official: true
  description: >-
    Node/TypeScript SDK for the screenpipe local REST API (pipe.queryScreenpipe,
    input control, notifications) used to build pipes and automations.
- language: javascript
  registry: npm
  name: "@screenpipe/browser"
  url: https://www.npmjs.com/package/@screenpipe/browser
  install: npm install @screenpipe/browser
